name: restoflow_pos
description: RestoFlow pos app - POS cashier app target. RF-100 adds the visible demo menu + cart UI (in-memory, no backend).
publish_to: none
version: 0.0.1
environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: '>=2.5.0 <3.0.0'
  # Persists the NON-SECRET selected UI language per device/browser (sprint).
  shared_preferences: '>=2.0.0 <3.0.0'
  # EGRESS-REMEDIATION-001: persistent (disk) byte cache for menu images on
  # io targets, keyed by the STABLE versioned object path instead of the
  # rotating signed token — an unchanged product photo downloads once per
  # device instead of once per menu refresh/app restart. Web keeps browser
  # HTTP caching (the cache manager is memory-backed there). The standard,
  # minimal pairing: cached_network_image's provider + flutter_cache_manager.
  cached_network_image: '>=3.4.0 <4.0.0'
  # Direct import of ImageRenderMethodForWeb (HttpGet keeps web decodes
  # byte-based like the previous NetworkImage, so decode-size caps hold).
  cached_network_image_platform_interface: '>=4.0.0 <5.0.0'
  flutter_cache_manager: '>=3.4.0 <4.0.0'
  restoflow_l10n:
    path: ../../packages/l10n
  restoflow_domain:
    path: ../../packages/domain
  restoflow_money:
    path: ../../packages/money
  restoflow_design_system:
    path: ../../packages/design_system
  # RF-115: the ESC/POS adapter + the LOCAL print-bridge client (loopback HTTP,
  # honest outcomes) that turns a prepared receipt into a real/sink print.
  restoflow_printing:
    path: ../../packages/printing
  # ANDROID-004: the shared native (Wi-Fi RAW/TCP + Bluetooth Classic SPP) ESC/POS
  # printing layer reused by POS + KDS (config models, web-safe BT connector,
  # device-local config providers, testers, transport resolver, settings UI).
  restoflow_native_printing:
    path: ../../packages/native_printing
  # RF-108 Stage 4: the auth gate (demo-mode fallback / role-based entry).
  restoflow_auth_identity:
    path: ../../packages/auth_identity
  restoflow_feature_auth:
    path: ../../packages/feature_auth
  # KITCHEN-PRINT-DUAL-001B: the SHARED kitchen-ticket document model + layout
  # builder (KdsTicketView -> PrintDocument -> ESC/POS). The POS direct kitchen
  # print builds the SAME KdsTicketView and renders it through the SAME builder
  # the KDS uses, so a ticket printed straight from the POS carries the same
  # operational detail. Web-safe (domain + printing only; no drift).
  restoflow_feature_kitchen:
    path: ../../packages/feature_kitchen
  # RF-129: the shared public-schema RPC transport (SyncRpcTransport) + SyncSession
  # the real outbox uses to POST order.submit ops to public.sync_push (RF-126).
  restoflow_data_remote:
    path: ../../packages/data_remote
  # PRINT-BLUETOOTH-RECOVERY-001: Bluetooth Classic (SPP) printing runs over the
  # in-house `restoflow.native_printing/bluetooth` MethodChannel implemented by
  # this app's MainActivity (the broken `print_bluetooth_thermal` plugin was
  # removed). permission_handler: the Android 12+ runtime BLUETOOTH_CONNECT
  # request (connect only — the app never scans; bonded devices only).
  permission_handler: ^11.3.1
  # KITCHEN-MODE-001C2A: the generic SecureKeyStore contract + SecretValue +
  # fail-closed exception types the kitchen-spool key adapter implements.
  restoflow_core:
    path: ../../packages/core
  # KITCHEN-MODE-001C2A: Android Keystore-backed storage for the kitchen-spool
  # AES key (same plugin/default options family as the device-session store in
  # feature_auth); web fails closed (no localStorage fallback).
  flutter_secure_storage: '>=9.0.0 <10.0.0'
  # KITCHEN-MODE-001C2B: the dedicated runtime kitchen-spool database, cipher,
  # key manager and bounded store. Production use is CONFINED to lib/src/spool
  # (the dormancy scan enforces it) and the import path stays structurally
  # impossible until 001C3 (no mode revision + no readiness reporting).
  restoflow_data_local:
    path: ../../packages/data_local
  # KITCHEN-MODE-001C2B: the native application-documents directory for the
  # dedicated spool database path (never called on web).
  path_provider: '>=2.1.0 <3.0.0'
  # KITCHEN-MODE-001C2B: SHA-256 for the NON-SECRET destination fingerprint
  # and the deterministic session fingerprint in the secure mode cache.
  crypto: '>=3.0.0 <4.0.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
  # KITCHEN-MODE-001C2A CI fix: platform-independent path resolution for the
  # backup-contract and dormancy source scans (CI runs `flutter test
  # apps/pos` from the repository root; local runs start inside the app).
  path: '>=1.9.0 <2.0.0'
  # (restoflow_data_local moved to regular dependencies in 001C2B — the spool
  # runtime is real production code now, confined to lib/src/spool.)

flutter:
  # Bundles the Material Icons font so `Icon(Icons.*)` renders glyphs (not the
  # missing-glyph "tofu" boxes). Required for any app that uses Material icons.
  uses-material-design: true
  # POS-PREMIUM-VISUAL-POLISH-001 → POS-DESIGN-HANDOFF-IMPLEMENTATION-004:
  # bundled type per the approved Claude Design package (tokens §10 FINAL) —
  # Alexandria 700/800 display, Rubik 400–700 body (covers Arabic AND Hebrew),
  # Inter 700/800 for money digits (true tabular figures). BUNDLED, not
  # fetched — the POS is offline-first and a till must render identically
  # with no network (the handoff's google_fonts suggestion is a mechanism the
  # offline canon forbids; the FAMILIES are implemented faithfully). Tajawal /
  # IBM Plex stay bundled as the fallback chain so no glyph ever regresses to
  # tofu. All OFL; licenses sit beside the files.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/Alexandria-ExtraBold.ttf
          weight: 800
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
