name: restoflow_design_system
description: RestoFlow design system - shared themeable UI foundations (shell). Real tokens, widgets, and RTL/LTR primitives land in later UI tickets.
publish_to: none
version: 0.0.1
environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  # TABLE-VISUAL-LAYOUT-118: the SHARED floor/table preset vocabulary
  # (`TableVisualPreset` / `FloorPreset`) lives in the pure-Dart domain next
  # to the floor geometry contract; the shared floor widgets take it directly
  # so no surface can invent its own preset enum. domain has no dependencies
  # of its own (no cycle).
  restoflow_domain:
    path: ../domain
dev_dependencies:
  flutter_test:
    sdk: flutter

# BIZBOT-REBRAND: the shared RestoflowBrandMark is a TEMPORARY typographic
# monogram drawn in code (no owner-approved BIZBOT logo yet), so no brand asset
# is bundled. The retired VEYRO symbol is kept UNREFERENCED for rollback under
# assets/brand/archive/ (not declared here, therefore never shipped).
