name: restoflow_design_system
description: RestoFlow design system - shared themeable UI foundations (shell). Real tokens, widgets, and RTL/LTR primitives land in later UI tickets.
publish_to: none
version: 0.0.1
environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  # TABLE-VISUAL-LAYOUT-118: the SHARED floor/table preset vocabulary
  # (`TableVisualPreset` / `FloorPreset`) lives in the pure-Dart domain next
  # to the floor geometry contract; the shared floor widgets take it directly
  # so no surface can invent its own preset enum. domain has no dependencies
  # of its own (no cycle).
  restoflow_domain:
    path: ../domain
dev_dependencies:
  flutter_test:
    sdk: flutter
  # bizbot_official_identity_test pins the generated brand assets by SHA-256.
  crypto: '>=3.0.0 <4.0.0'

# BIZBOT OFFICIAL IDENTITY (2026-09-05): the shared RestoflowBrandMark renders
# the owner's official symbol and wordmarks. These three PNGs are the ONLY
# brand assets bundled; they are generated from the pinned masters by
# tools/brand/generate_bizbot_official_icons.py (see
# tools/brand/BIZBOT_BRAND_ASSETS.md for the hashes). The identity board and
# the retired VEYRO symbol (assets/brand/archive/) are deliberately NOT
# declared here, therefore never shipped.
flutter:
  assets:
    - assets/brand/bizbot/bizbot_symbol.png
    - assets/brand/bizbot/bizbot_wordmark_en.png
    - assets/brand/bizbot/bizbot_wordmark_ar.png
